name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: fmt
        run: make fmt
      - name: vet
        run: make vet
      - name: test
        run: make test
      - name: build
        run: make build
